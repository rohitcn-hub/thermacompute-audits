name: process audit

on:
  issues:
    types: [opened]

jobs:
  process-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install pandas numpy reportlab matplotlib
      
      - name: Download attachments
        run: |
          echo "Downloading attachments from issue..."
      
      - name: Generate PDF
        run: |
          python generate_pdf.py
      
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit_report.pdf
